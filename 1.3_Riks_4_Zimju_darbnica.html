<!DOCTYPE html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zīmju darbnīca</title><style>
:root{--bg:#ffffff;--soft:#FFF8D6;--yellow:#F2C200;--yellow2:#FFD84D;--green:#3E9B4F;--green2:#2E7A3C;--greenSoft:#E6F4E4;
--text:#24382B;--muted:#5E6E63;--red:#D9534F;--shadow:0 6px 0 rgba(0,0,0,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#EEF3EC;overflow:hidden;font-family:"Segoe UI",Candara,"Trebuchet MS",Arial,sans-serif;color:var(--text)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;background:var(--bg);position:relative;transform-origin:center center;flex:none;
 border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.12);user-select:none;-webkit-user-select:none}
header{height:118px;display:flex;align-items:center;gap:26px;padding:0 44px;border-bottom:10px solid var(--yellow);background:var(--greenSoft)}
header .badge{width:74px;height:74px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;flex:none}
header h1{font-size:50px;font-weight:800;color:var(--green2);line-height:1}
header p{font-size:28px;color:var(--muted);margin-top:6px}
.btn{font:inherit;border:none;cursor:pointer;border-radius:22px;background:var(--yellow2);color:var(--text);font-size:30px;font-weight:700;
 padding:16px 30px;box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:#fff;border:4px solid var(--green);color:var(--green2)}
#fsBtn{position:absolute;right:22px;bottom:18px;z-index:50;font:inherit;font-size:20px;font-weight:700;border:3px solid var(--green);background:#fff;color:var(--green2);
 border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
#fsBtn svg{width:24px;height:24px}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.stars{display:flex;gap:8px}
.star{width:40px;height:40px}

#main{display:flex;gap:24px;padding:22px 30px 0}
#palette{width:316px;flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start}
.sh{width:72px;height:72px;border-radius:16px;border:4px solid #e3e3e3;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#3E9B4F}
.sh svg{width:54px;height:54px;fill:currentColor}
#board{position:relative;width:960px;height:660px;background:#fff;border:6px dashed #cfd8cf;border-radius:24px;overflow:hidden;flex:none;touch-action:none}
#frame{position:absolute;inset:0;pointer-events:none}
.el{position:absolute;touch-action:none;cursor:grab}
.el svg{width:100%;height:100%;fill:currentColor;display:block}
.el.sel{outline:5px dashed var(--yellow);outline-offset:6px}
#tools{flex:1;display:flex;flex-direction:column;gap:8px}
#tools h3{font-size:21px;color:var(--muted)}
#cols{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.col{height:46px;border-radius:14px;border:4px solid #fff;box-shadow:0 0 0 2px #ddd;cursor:pointer}
.col.on{box-shadow:0 0 0 5px var(--text)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#tools .btn{font-size:20px;padding:9px 6px;white-space:nowrap}
#frames{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#frames .btn{font-size:19px}
#frames .btn.on{background:var(--green);color:#fff}
</style></head>
<body><div id="wrap"><div id="stage">
<header><div class="badge">4</div><div><h1>Zīmju darbnīca</h1><p>Saliec savu zīmi vai bilžu vēstuli. Lai klase uzmin, ko tā saka!</p></div></header>
<div id="main"><div id="palette"></div>
<div id="board"><svg id="frame" viewBox="0 0 960 660"></svg></div>
<div id="tools"><h3>Pamats</h3><div id="frames">
<button class="btn" data-f="aplis">Aplis</button><button class="btn" data-f="trijsturis">Trijstūris</button>
<button class="btn" data-f="kvadrats">Kvadrāts</button><button class="btn" data-f="vestule">Bilžu vēstule</button>
<button class="btn" data-f="tukss" style="grid-column:span 2">Bez pamata</button></div>
<h3>Krāsa</h3><div id="cols"></div>
<h3>Izvēlētā forma</h3><div class="row"><button class="btn" id="big">+ Lielāka</button><button class="btn" id="small">− Mazāka</button>
<button class="btn" id="rot">↻ Pagriezt</button><button class="btn" id="del">✕ Dzēst</button></div>
<button class="btn ghost" id="clear" style="margin-bottom:80px">Notīrīt visu</button></div></div>
<button id="fsBtn" type="button"><svg viewBox="0 0 24 24"></svg><span>Atvērt pilnekrāna režīmu</span></button>
</div></div>
<script>

  b.querySelector('svg').innerHTML=isFs()?'<path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>':'<path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>';
  setTimeout(fit,60);}
 b.addEventListener('click',function(){var e=d.documentElement;
  if(!isFs()){(e.requestFullscreen||e.webkitRequestFullscreen||e.msRequestFullscreen).call(e);}
  else{(d.exitFullscreen||d.webkitExitFullscreen||d.msExitFullscreen).call(d);}});
 ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(function(ev){d.addEventListener(ev,upd);});
 upd();
})();
window.shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};
window.starSVG=function(on){return '<svg class="star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="'+(on?'#F2C200':'#E3E3E3')+'" stroke="'+(on?'#C99A00':'#cfcfcf')+'" stroke-width="1"/></svg>';};
