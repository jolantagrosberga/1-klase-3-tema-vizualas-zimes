<!DOCTYPE html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ko saka seja?</title><style>
:root{--bg:#ffffff;--soft:#FFF8D6;--yellow:#F2C200;--yellow2:#FFD84D;--green:#3E9B4F;--green2:#2E7A3C;--greenSoft:#E6F4E4;
--text:#24382B;--muted:#5E6E63;--red:#D9534F;--shadow:0 6px 0 rgba(0,0,0,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#EEF3EC;overflow:hidden;font-family:"Segoe UI",Candara,"Trebuchet MS",Arial,sans-serif;color:var(--text)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;background:var(--bg);position:relative;transform-origin:center center;flex:none;
 border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.12);user-select:none;-webkit-user-select:none}
header{height:118px;display:flex;align-items:center;gap:26px;padding:0 44px;border-bottom:10px solid var(--yellow);background:var(--greenSoft)}
header .badge{width:74px;height:74px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;flex:none}
header h1{font-size:50px;font-weight:800;color:var(--green2);line-height:1}
header p{font-size:28px;color:var(--muted);margin-top:6px}
.btn{font:inherit;border:none;cursor:pointer;border-radius:22px;background:var(--yellow2);color:var(--text);font-size:30px;font-weight:700;
 padding:16px 30px;box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:#fff;border:4px solid var(--green);color:var(--green2)}
#fsBtn{position:absolute;right:22px;bottom:18px;z-index:50;font:inherit;font-size:20px;font-weight:700;border:3px solid var(--green);background:#fff;color:var(--green2);
 border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
#fsBtn svg{width:24px;height:24px}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.stars{display:flex;gap:8px}
.star{width:40px;height:40px}

#main{display:flex;gap:40px;padding:34px 44px 0}
#photoBox{width:860px;flex:none}
#photo{width:860px;height:510px;border-radius:24px;overflow:hidden;background:#f1f1f1;border:6px solid var(--yellow);display:flex;align-items:center;justify-content:center}
#photo img{width:100%;height:100%;object-fit:cover}
#sit{font-size:31px;font-weight:700;margin-top:14px;line-height:1.25;min-height:80px}
#right{flex:1;display:flex;flex-direction:column}
#q{font-size:38px;font-weight:800;color:var(--green2);margin-bottom:16px}
#faces{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.face{background:#fff;border:5px solid #e4e4e4;border-radius:24px;padding:10px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:inherit;font-size:24px;font-weight:700;color:var(--text)}
.face svg{width:118px;height:118px}
.face.ok{border-color:var(--green);background:var(--greenSoft)}
.face.no{border-color:#f0b3b1}
#fb{margin-top:18px;font-size:30px;font-weight:700;min-height:84px;border-radius:20px;padding:14px 20px;background:var(--soft)}
#nav{position:absolute;left:44px;bottom:22px;display:flex;align-items:center;gap:24px}
#dots{display:flex;gap:10px}#dots i{width:22px;height:22px;border-radius:50%;background:#ddd;display:block}#dots i.on{background:var(--green)}#dots i.cur{outline:4px solid var(--yellow)}
</style></head>
<body><div id="wrap"><div id="stage">
<header><div class="badge">1</div><div><h1>Ko saka seja?</h1><p>Sejas izteiksme parāda sajūtas bez vārdiem.</p></div></header>
<div id="main"><div id="photoBox"><div id="photo"><img id="pimg" alt=""></div><div id="sit"></div></div>
<div id="right"><div id="q">Kā tu justos? Pieskaries sejiņai!</div><div id="faces"></div><div id="fb"></div></div></div>
<div id="nav"><button class="btn ghost" id="prev">◀ Atpakaļ</button><div id="dots"></div><button class="btn green" id="next">Nākamā bilde ▶</button></div>
<button id="fsBtn" type="button"><svg viewBox="0 0 24 24"></svg><span>Atvērt pilnekrāna režīmu</span></button>
</div></div>
<script>
(function(){
 var st=document.getElementById('stage');

  setTimeout(fit,60);}
 b.addEventListener('click',function(){var e=d.documentElement;

  else{(d.exitFullscreen||d.webkitExitFullscreen||d.msExitFullscreen).call(d);}});
 ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(function(ev){d.addEventListener(ev,upd);});
 upd();
})();
window.shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};
window.starSVG=function(on){return '<svg class="star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="'+(on?'#F2C200':'#E3E3E3')+'" stroke="'+(on?'#C99A00':'#cfcfcf')+'" stroke-width="1"/></svg>';};
