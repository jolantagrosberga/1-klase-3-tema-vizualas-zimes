<!DOCTYPE html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zīmju viktorīna</title><style>
:root{--bg:#ffffff;--soft:#FFF8D6;--yellow:#F2C200;--yellow2:#FFD84D;--green:#3E9B4F;--green2:#2E7A3C;--greenSoft:#E6F4E4;
--text:#24382B;--muted:#5E6E63;--red:#D9534F;--shadow:0 6px 0 rgba(0,0,0,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#EEF3EC;overflow:hidden;font-family:"Segoe UI",Candara,"Trebuchet MS",Arial,sans-serif;color:var(--text)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;background:var(--bg);position:relative;transform-origin:center center;flex:none;
 border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.12);user-select:none;-webkit-user-select:none}
header{height:118px;display:flex;align-items:center;gap:26px;padding:0 44px;border-bottom:10px solid var(--yellow);background:var(--greenSoft)}
header .badge{width:74px;height:74px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;flex:none}
header h1{font-size:50px;font-weight:800;color:var(--green2);line-height:1}
header p{font-size:28px;color:var(--muted);margin-top:6px}
.btn{font:inherit;border:none;cursor:pointer;border-radius:22px;background:var(--yellow2);color:var(--text);font-size:30px;font-weight:700;
 padding:16px 30px;box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:#fff;border:4px solid var(--green);color:var(--green2)}
#fsBtn{position:absolute;right:22px;bottom:18px;z-index:50;font:inherit;font-size:20px;font-weight:700;border:3px solid var(--green);background:#fff;color:var(--green2);
 border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
#fsBtn svg{width:24px;height:24px}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.stars{display:flex;gap:8px}
.star{width:40px;height:40px}

#main{display:flex;gap:44px;padding:36px 44px 0}
#pic{width:760px;height:560px;flex:none;border-radius:26px;overflow:hidden;border:6px solid var(--yellow);background:#fafafa;display:flex;align-items:center;justify-content:center}
#pic img{max-width:100%;max-height:100%;object-fit:contain}
#pic img.photo{width:100%;height:100%;object-fit:cover}
#side{flex:1;display:flex;flex-direction:column;gap:20px}
#num{font-size:28px;font-weight:700;color:var(--muted)}
#q{font-size:44px;font-weight:800;color:var(--green2);line-height:1.2;min-height:110px}
.ans{font:inherit;font-size:36px;font-weight:700;text-align:left;padding:22px 28px;border-radius:24px;border:5px solid #e3e3e3;background:#fff;cursor:pointer;color:var(--text)}
.ans.ok{border-color:var(--green);background:var(--greenSoft)}
.ans.no{border-color:#f0b3b1;background:#FDECEC}
#bottom{position:absolute;left:44px;bottom:22px;display:flex;gap:20px;align-items:center}
#end{position:absolute;inset:118px 0 0 0;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:26px}
#end h2{font-size:64px;color:var(--green2)}#end p{font-size:38px}
#end .star{width:70px;height:70px}
</style></head>
<body><div id="wrap"><div id="stage">
<header><div class="badge">5</div><div><h1>Zīmju viktorīna</h1><p>Izlasi jautājumu un izvēlies pareizo atbildi.</p></div></header>
<div id="main"><div id="pic"><img id="img" alt=""></div>
<div id="side"><div id="num"></div><div id="q"></div><div id="answers" style="display:flex;flex-direction:column;gap:18px"></div></div></div>
<div id="bottom"><div class="stars" id="stars"></div><button class="btn green" id="next" style="visibility:hidden">Nākamais ▶</button></div>
<div id="end"><h2>Malacis!</h2><p id="score"></p><div class="stars" id="bigstars"></div><button class="btn green" id="again">↻ Spēlēt vēlreiz</button></div>
<button id="fsBtn" type="button"><svg viewBox="0 0 24 24"></svg><span>Atvērt pilnekrāna režīmu</span></button>
</div></div>
<script>
(function(){
 var st=document.getElementById('stage');
 function fit(){var s=Math.min(window.innerWidth/1600,window.innerHeight/900);st.style.transform='scale('+s+')';window.__scale=s;}
 window.addEventListener('resize',fit);fit();
 var b=document.getElementById('fsBtn'),d=document;
 function isFs(){return d.fullscreenElement||d.webkitFullscreenElement||d.msFullscreenElement;}
 function upd(){b.querySelector('span').textContent=isFs()?'Iziet no pilnekrāna režīma':'Atvērt pilnekrāna režīmu';
  b.querySelector('svg').innerHTML=isFs()?'<path d="M9 3v6H3M15 3v6h6M9 21v-6H3M15 21v-6h6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>':'<path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>';
  setTimeout(fit,60);}
 b.addEventListener('click',function(){var e=d.documentElement;
  if(!isFs()){(e.requestFullscreen||e.webkitRequestFullscreen||e.msRequestFullscreen).call(e);}
  else{(d.exitFullscreen||d.webkitExitFullscreen||d.msExitFullscreen).call(d);}});
 ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(function(ev){d.addEventListener(ev,upd);});
 upd();
})();
window.shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;};
window.starSVG=function(on){return '<svg class="star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7L12 17.3 5.8 20.9l1.6-7L2 9.2l7.1-.6z" fill="'+(on?'#F2C200':'#E3E3E3')+'" stroke="'+(on?'#C99A00':'#cfcfcf')+'" stroke-width="1"/></svg>';};

var i,score,res,locked;
function start(){i=0;score=0;res=[];document.getElementById('end').style.display='none';show();}
function stars(){var h='';for(var j=0;j<D.length;j++)h+=starSVG(res[j]===1);document.getElementById('stars').innerHTML=h;}
function show(){locked=false;var it=D[i];var im=document.getElementById('img');im.src=it.img;im.className=it.img.indexOf('image/jpeg')>0?'photo':'';
 document.getElementById('num').textContent=(i+1)+'. jautājums no '+D.length;document.getElementById('q').textContent=it.q;
 var box=document.getElementById('answers');box.innerHTML='';
 shuffle(it.a.map(function(t,k){return{t:t,ok:k===0}})).forEach(function(o){var b=document.createElement('button');b.className='ans';b.textContent=o.t;
  b.onclick=function(){if(locked)return;if(o.ok){locked=true;b.classList.add('ok','pop');if(res[i]===undefined){res[i]=1;score++;}document.getElementById('next').style.visibility='visible';}
   else{b.classList.add('no','shake');if(res[i]===undefined)res[i]=0;setTimeout(function(){b.classList.remove('shake')},500);}stars();};box.appendChild(b);});
 document.getElementById('next').style.visibility='hidden';stars();}
