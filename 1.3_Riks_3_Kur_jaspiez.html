<!DOCTYPE html>
<html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kur jāspiež?</title><style>
:root{--bg:#ffffff;--soft:#FFF8D6;--yellow:#F2C200;--yellow2:#FFD84D;--green:#3E9B4F;--green2:#2E7A3C;--greenSoft:#E6F4E4;
--text:#24382B;--muted:#5E6E63;--red:#D9534F;--shadow:0 6px 0 rgba(0,0,0,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#EEF3EC;overflow:hidden;font-family:"Segoe UI",Candara,"Trebuchet MS",Arial,sans-serif;color:var(--text)}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{width:1600px;height:900px;background:var(--bg);position:relative;transform-origin:center center;flex:none;
 border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.12);user-select:none;-webkit-user-select:none}
header{height:118px;display:flex;align-items:center;gap:26px;padding:0 44px;border-bottom:10px solid var(--yellow);background:var(--greenSoft)}
header .badge{width:74px;height:74px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;flex:none}
header h1{font-size:50px;font-weight:800;color:var(--green2);line-height:1}
header p{font-size:28px;color:var(--muted);margin-top:6px}
.btn{font:inherit;border:none;cursor:pointer;border-radius:22px;background:var(--yellow2);color:var(--text);font-size:30px;font-weight:700;
 padding:16px 30px;box-shadow:var(--shadow);transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.btn.green{background:var(--green);color:#fff}
.btn.ghost{background:#fff;border:4px solid var(--green);color:var(--green2)}
#fsBtn{position:absolute;right:22px;bottom:18px;z-index:50;font:inherit;font-size:20px;font-weight:700;border:3px solid var(--green);background:#fff;color:var(--green2);
 border-radius:14px;padding:10px 16px;display:flex;align-items:center;gap:10px;cursor:pointer}
#fsBtn svg{width:24px;height:24px}
.pop{animation:pop .45s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.shake{animation:shake .45s ease}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.stars{display:flex;gap:8px}
.star{width:40px;height:40px}

#main{display:flex;gap:40px;padding:30px 44px 0;align-items:flex-start}
#left{width:900px;height:640px;flex:none;position:relative}
#tablet{width:900px;height:620px;background:#263238;border-radius:56px;padding:40px;box-shadow:0 12px 0 #1a2328}
#screen{width:100%;height:100%;background:#E3F2FD;border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);place-items:center;padding:20px}
.ic{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:inherit;border-radius:30px;padding:6px}
.ic svg{width:150px;height:150px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.15))}
.ic.ok{background:#C8E6C9}
#map{width:900px;height:600px;position:relative;border-radius:24px;overflow:hidden;border:6px solid var(--yellow);display:none}
#map>svg{position:absolute;inset:0}
.mk{position:absolute;width:84px;height:84px;margin:-42px 0 0 -42px;border:none;background:none;cursor:pointer;border-radius:50%;padding:6px}
.mk svg{width:72px;height:72px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.mk.ok{background:rgba(255,255,255,.85);box-shadow:0 0 0 6px var(--green)}
#side{flex:1;display:flex;flex-direction:column;gap:16px}
#tabs{display:flex;gap:10px}#tabs .btn{font-size:26px;padding:12px 22px;background:#fff;border:4px solid var(--yellow)}#tabs .btn.on{background:var(--yellow2)}
#q{font-size:38px;font-weight:800;color:var(--green2);line-height:1.2;min-height:118px;background:var(--soft);border-radius:24px;padding:18px 24px}
#fb{font-size:28px;font-weight:700;min-height:40px}
#legend{display:none;grid-template-columns:1fr 1fr;gap:8px 14px;background:#fff;border:4px solid #e3e3e3;border-radius:20px;padding:12px 16px}
#legend h3{grid-column:span 2;font-size:24px;color:var(--muted)}
#legend div{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
#legend svg{width:42px;height:42px;flex:none}
#stars{flex-wrap:wrap}
</style></head>
<body><div id="wrap"><div id="stage">

<div id="side"><div id="tabs"><button class="btn on" data-m="tab">Planšete</button><button class="btn" data-m="map">Karte</button></div>
<div id="q"></div><div id="fb"></div><div id="legend"></div>
<div class="stars" id="stars"></div><button class="btn" id="again" style="align-self:flex-start">↻ Sākt no jauna</button></div></div>
<button id="fsBtn" type="button"><svg viewBox="0 0 24 24"></svg><span>Atvērt pilnekrāna režīmu</span></button>
</div></div>

 ['fullscreenchange','webkitfullscreenchange','MSFullscreenChange'].forEach(function(ev){d.addEventListener(ev,upd);});

})();

 else{var m=document.getElementById('map');m.innerHTML=MAPBG;
  MAP.forEach(function(it){var b=document.createElement('button');b.className='mk';b.style.left=it.x+'px';b.style.top=it.y+'px';b.innerHTML=it.svg;b.onclick=function(){tap(it,b)};m.appendChild(b);});}

 else{b.classList.add('shake');fb.innerHTML='Šī ir <b>'+it.name+'</b>. Meklē vēl!';fb.style.color='var(--red)';}

[].forEach.call(document.querySelectorAll('#tabs .btn'),function(b){b.onclick=function(){[].forEach.call(document.querySelectorAll('#tabs .btn'),function(x){x.classList.remove('on')});b.classList.add('on');mode=b.dataset.m;start();};});
